site_name: BEYOND Grasp
site_description: PiPER·D405/D435·SAM 3·GraspGenX의 심·실물 공통 파지 시나리오와 Action 인터페이스
site_url: https://ggh-png.github.io/rwh_beyond/
repo_url: https://github.com/ggh-png/rwh_beyond
repo_name: ggh-png/rwh_beyond
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - 홈: index.md
  - 처음 사용하기:
      - 시스템 구성: project-overview.md
      - 환경과 빌드: project-containers.md
      - GPU 추론 서버 준비: inference-server-operation.md
      - 빠른 시작: grasp-pipeline-guide.md
      - 실물 PiPER 준비: piper-hardware-moveit.md
  - 설정과 운영:
      - BT와 공통 설정: real-bt.md
      - Runner 장치 설정: runner-device-settings.md
      - CAN·SSH·모델 연결: piper-runtime.md
      - 카메라:
          - D405 센서와 TF: d405-sensors.md
          - D405 장착 설정: d405-runner-mount.md
          - D435 단독 점검: d435-standalone.md
          - D435 BT 연결·장착 설정: d435-bt-demo.md
      - 파지와 모션:
          - 점군 추정 폭으로 닫기: width-aware-bt.md
          - 손목 회전·MoveIt 계획: grasp-motion-tuning.md
          - 최종 TCP 높이 필터: grasp-height-filter.md
          - 속도·실행 시간 제한: moveit-speed-settings.md
  - 문제 해결:
      - 증상별 확인 순서: troubleshooting.md
      - 파지 후보 탈락·오류: grasp-troubleshooting.md
      - RViz 디버깅: grasp-visualization.md
  - 시스템 이해와 개발:
      - 집기·배치 BT 흐름: bt-flows.md
      - BT와 실행 구조: bt-architecture.md
      - 데이터와 좌표계: project-data.md
      - SAM 3 객체 분할: sam3-perception.md
      - GraspGenX 파지 후보: graspgenx-model.md
      - 코드를 따라 읽기: project-code-map.md
      - 테스트와 개발: development.md
  - 인터페이스 참조:
      - RunDemo Action: bt-operation.md
      - 모델별 ROS 인터페이스: model-bridges.md
      - BT 노드 기능·포트: bt-grasp-stages.md
  - 프로젝트 안내:
      - 문서 관리: documentation.md
      - 구성 요소와 출처: upstream.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: [en]
extra_css:
  - assets/stylesheets/docs.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
