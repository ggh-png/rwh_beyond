site_name: BEYOND Grasp
site_description: PiPER·D405/D435·SAM 3·GraspGenX의 심·실물 공통 파지 시나리오와 Action 인터페이스
site_url: https://ggh-png.github.io/rwh_beyond/
repo_url: https://github.com/ggh-png/rwh_beyond
repo_name: ggh-png/rwh_beyond
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - toc.follow
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - 시작하기:
      - 홈: index.md
      - 빠른 시작: grasp-pipeline-guide.md
      - 환경 준비:
          - 시스템 구성: project-overview.md
          - 컨테이너 생성: docker-containers.md
          - 환경과 빌드: project-containers.md
          - GPU 추론 서버: inference-server-operation.md
          - SSH 파일 추론: file-inference-exchange.md
          - 실물 PiPER 준비: piper-hardware-moveit.md
  - 코드 구조:
      - 코드를 따라 읽기: project-code-map.md
      - 집기·배치 BT 흐름: bt-flows.md
      - BT 내부 구조: bt-architecture.md
      - 데이터와 좌표계: project-data.md
      - 테스트와 개발: development.md
      - 구성 요소와 출처: upstream.md
  - 설정과 변경:
      - 변경할 파일 찾기: real-bt.md
      - 장치·런타임:
          - Runner 장치 설정: runner-device-settings.md
          - CAN·SSH·모델 연결: piper-runtime.md
          - D405 센서와 TF: d405-sensors.md
          - D405 장착 설정: d405-runner-mount.md
          - D435 연결·장착 설정: d435-bt-demo.md
          - D435 단독 실행: d435-standalone.md
      - 파지와 모션:
          - 추정 폭·멀티뷰: width-aware-bt.md
          - 손목 회전·MoveIt 계획: grasp-motion-tuning.md
          - TCP 높이 필터: grasp-height-filter.md
          - 속도·실행 시간 제한: moveit-speed-settings.md
  - ROS 인터페이스:
      - 토픽·서비스·액션 목록: ros-interfaces.md
      - RunDemo Action: bt-operation.md
      - 모델 브릿지: model-bridges.md
      - SAM 3 분할: sam3-perception.md
      - GraspGenX 후보 생성: graspgenx-model.md
      - BT 노드와 포트: bt-grasp-stages.md
not_in_nav: |
  documentation.md
  troubleshooting.md
  grasp-troubleshooting.md
  grasp-visualization.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: [en]
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - assets/stylesheets/docs.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
