site_name: RWH · Husky 사용 가이드
site_description: Husky 연결부터 외부 Jazzy PC의 SLAM과 Nav2 운용까지
site_url: https://ggh-png.github.io/rwh_beyond/
repo_url: https://github.com/ggh-png/rwh_beyond
repo_name: ggh-png/rwh_beyond
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  locale: en
  color_mode: auto
nav:
  - 시작하기: index.md
  - SSH와 본체 확인: connection.md
  - 외부 PC 준비: setup.md
  - SLAM과 Nav2 실행: operation.md
  - TF와 토픽: interfaces.md
  - 파라미터 설정: configuration.md
  - ros_runner 운용: runner.md
  - 로봇 팔 BT:
      - 구조 이해: bt-architecture.md
      - Depth 관측과 runner 흐름: depth-bt-flow.md
      - 노드 사용법: bt-nodes.md
      - 실행과 Groot2: bt-operation.md
      - GraspGenX 원격 추론: graspgenx-integration.md
      - 빨간 상자 파지: red-box-grasp.md
  - 문제 해결: troubleshooting.md
  - GraspGenX 작업 기록: work-log-2026-11-10.md
  - 문서 관리: documentation.md
  - 구조와 출처: upstream.md
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
plugins:
  - search:
      lang: [en]

extra_javascript:
  - path: assets/javascripts/mermaid.mjs
    type: module

extra_css:
  - assets/stylesheets/bt-docs.css
