site_name: BEYOND Grasp
site_description: PiPER·D405·SAM 3·GraspGenX의 심·실물 공통 파지 시나리오와 Action 인터페이스
site_url: https://ggh-png.github.io/rwh_beyond/
repo_url: https://github.com/ggh-png/rwh_beyond
repo_name: ggh-png/rwh_beyond
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/robot-industrial
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - 문서 시작: index.md
  - 시작하기:
      - 시스템 구성: project-overview.md
      - 환경과 빌드: project-containers.md
      - 실행 가이드: grasp-pipeline-guide.md
      - 심·실물 공통 BT와 설정: real-bt.md
      - Manipulation Action 인터페이스: bt-operation.md
  - 센서와 실행 환경:
      - 외부 GPU 추론 서버 운영: inference-server-operation.md
      - 런타임·CAN·모델 연결: piper-runtime.md
      - 실물 PiPER 제어: piper-hardware-moveit.md
      - D405 센서·장착 TF: d405-sensors.md
      - RViz 디버깅: grasp-visualization.md
  - 구현과 데이터:
      - 데이터와 좌표계: project-data.md
      - 모델별 ROS 인터페이스: model-bridges.md
      - SAM 3 객체 분할: sam3-perception.md
      - GraspGenX 파지 후보: graspgenx-model.md
      - BT와 실행 구조: bt-architecture.md
      - BT 단계·포트·Action: bt-grasp-stages.md
      - 코드를 따라 읽기: project-code-map.md
  - 문서 관리: documentation.md
  - 구성 요소와 출처: upstream.md
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search:
      lang: [en]
extra_css:
  - assets/stylesheets/docs.css
