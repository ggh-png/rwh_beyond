bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: base_link
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Allow MoveIt and MuJoCo action servers to finish starting (milliseconds).
    wait_for_service_timeout: 30000
    action_server_result_timeout: 900.0
    plugin_lib_names: [rwh_beyond_bt_nodes]
    navigators: [demo]
    demo:
      plugin: rwh_beyond_navigator::DemoNavigator
    run_demo:
      enable_groot_monitoring: true
      groot_server_port: 5555

bt_lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [bt_navigator]
